# @package _global_
# Hardware profile: v100. Values are final after the #8 benchmark.
# Effective denoiser batch stays 128 (v1 parity): 32 x 4 = 128.
denoiser:
  training:
    batch_size: 32
    grad_acc_steps: 4

upsampler:
  training:
    batch_size: 4
    grad_acc_steps: 4

training:
  num_workers_data_loaders: 8
  tf32: false
  precision: fp16  # bf16 | fp16 | fp32
  compile_wm: false
