// generate_human.cfg: a human plays offline against bots; the human is recorded (profile "human"), see #22, #23.
// SAFETY: HLAE and CS2 are only ever run offline with -insecure. Never join a VAC server with HLAE loaded.
// Same facts as generate_dm.cfg (docs/HLAE_NOTES.md). The human stays on a team, so generate does not send `jointeam 1`
// for this profile; human sessions use the fixed_player segment policy.

// GOTV, BEFORE `map`: every player is in the demo
tv_enable 1
tv_transmitall 1
tv_record_immediate 1

// Deathmatch on dust2, bots filled around the human
game_type 1
game_mode 2
map de_dust2
bot_quota 10
bot_quota_mode fill
bot_difficulty 2

// The session is recorded by generate over netcon (`sv_cheats 1; tv_record <name>` with generate.chunking = gotv,
// `sv_cheats 1; record <name>` with netcon), not from this cfg.
