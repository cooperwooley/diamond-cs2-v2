// render_base.cfg: mirv_streams setup shared by every render_<demo_id>.cfg (see #14, #15).
// cs2wm.pipeline.render.build_render_cfg substitutes {stream}, {fps} and {settings} from config/cs2wm.yaml, then appends
// `mirv_streams record name`, `mirv_cmd clear`, the per-segment spec_mode/spec_player/record schedule and a final `quit`.
// SAFETY: HLAE and CS2 are only ever run offline with -insecure. Never join a VAC server with HLAE loaded.
// Verified in the #14 session (HLAE 2.192.10, CS2 build 26445667); see docs/HLAE_NOTES.md.

// The default spectator x-ray draws red silhouettes of the enemies through walls; switch it off before recording
spec_show_xray 0

// Normal stream captured before the UI: no HUD, crosshair or killfeed, the viewmodel stays
mirv_streams add normal {stream}
mirv_streams edit {stream} capture beforeUi

// Output settings (afxClassic = TGA sequence, <name>/takeNNNN/<stream>/00000.tga; render.output_format = ffmpeg swaps in
// the preset, which needs C:\hlae\ffmpeg\ffmpeg.exe: without it HLAE writes 0 frames)
mirv_streams settings edit afxDefault settings {settings}

// Fixed fps (forces host_framerate), no audio
mirv_streams record fps {fps}
mirv_streams record startMovieWav 0
