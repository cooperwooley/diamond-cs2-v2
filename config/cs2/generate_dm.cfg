// generate_dm.cfg: offline bot deathmatch on de_dust2 (profile "dm"), see #13.
// SAFETY: HLAE and CS2 are only ever run offline with -insecure. Never join a VAC server with HLAE loaded.
// Every command below is a CANDIDATE from #13 / #14 and is UNVERIFIED until the #14 debug session confirms it.
// CONFIRM(#14): replace with the validated commands and record the final cvars in docs/HLAE_NOTES.md.
// CONFIRM(#14): commands after `map` may run before the map has loaded (the #14 notes run them "after load"); if so, split
// them into a second cfg that generate sends over netcon after map_load_wait_s.

// UNVERIFIED — confirm in #14: deathmatch on dust2
game_type 1
game_mode 2
map de_dust2

// UNVERIFIED — confirm in #14: ~10 bots, filled, medium difficulty, joining immediately
bot_quota 10
bot_quota_mode fill
bot_difficulty 2
bot_join_after_player 0

// UNVERIFIED — confirm in #14: rifles only
bot_allow_rifles 1
bot_allow_pistols 0
bot_allow_snipers 0
bot_allow_shotguns 0
bot_allow_sub_machine_guns 0
bot_allow_machine_guns 0
// UNVERIFIED — confirm in #14: only if bots still pick scoped rifles (AUG/SG)
// mp_t_default_primary weapon_ak47
// mp_ct_default_primary weapon_m4a1

// UNVERIFIED — confirm in #14: local player spectates, only bots play
jointeam 1

// UNVERIFIED — confirm in #14: chunking option (A) GOTV autorecord, one demo per map cycle
// tv_enable 1
// tv_autorecord 1
// mp_timelimit 10
// Option (B): send `stop; record <name>` over -netconport every N minutes (see cs2wm/pipeline/netcon.py)
