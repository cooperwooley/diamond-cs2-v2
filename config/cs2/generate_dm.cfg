// generate_dm.cfg: offline bot deathmatch on de_dust2 (profile "dm"), see #13, #14, #73.
// SAFETY: HLAE and CS2 are only ever run offline with -insecure. Never join a VAC server with HLAE loaded.
// Verified in the #14 session on CS2 build 26445667; the evidence and the reasons are in docs/HLAE_NOTES.md.
// cs2wm generate sends the rest over -netconport: `jointeam 1` once the map has loaded (it is lost when exec'd here,
// because the local client is not connected yet), then `sv_cheats 1; tv_record <name>` / `tv_stoprecord` per chunk.

// GOTV, BEFORE `map` (set after it, the recording stalls): every player is in the demo.
// `tv_autorecord` is not used: it writes game/csgo/replays/auto-*.dem with names we do not control.
tv_enable 1
tv_transmitall 1
tv_record_immediate 1
// tv_delay 0 would lose less on a crash (the last ~30 s of GOTV delay are lost), but the gamemode cfg resets it to 30 at
// map load and it had no effect in the #14 runs, so it is not set.

// Deathmatch on dust2 (the map line must come after the tv_* lines above)
game_type 1
game_mode 2
map de_dust2

// Commands after `map` take effect. ~10 bots, filled, medium difficulty, joining immediately
bot_quota 10
bot_quota_mode fill
bot_difficulty 2
bot_join_after_player 0

// Rifles only
bot_allow_rifles 1
bot_allow_pistols 0
bot_allow_snipers 0
bot_allow_shotguns 0
bot_allow_sub_machine_guns 0
bot_allow_machine_guns 0
// Weapons check on the first pilot demo (#19): look at item_equip / the active weapon in the demo dump. If scoped
// rifles (AUG/SG) show up, enable these; they read back correctly. The gamemode cfg re-executes at map load and resets
// mp_* cvars, so if they do not stick send them over netcon after the map has loaded.
// mp_t_default_primary weapon_ak47
// mp_ct_default_primary weapon_m4a1
