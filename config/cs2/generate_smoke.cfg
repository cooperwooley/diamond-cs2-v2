// generate_smoke.cfg: bot deathmatch with grenades enabled (profile "smoke"), see #23.
// SAFETY: HLAE and CS2 are only ever run offline with -insecure. Never join a VAC server with HLAE loaded.
// TODO(#23): keep only the grenade cvars that make bots throw smokes and record them verbatim here; they are still
// untested (the #14 session did not cover grenades).

// Same base setup as generate_dm.cfg
exec generate_dm

// Bots may throw grenades; hand every bot a smoke
bot_allow_grenades 1
mp_ct_default_grenades weapon_smokegrenade
mp_t_default_grenades weapon_smokegrenade
ammo_grenade_limit_total 5
