// generate_dm_post.cfg: cvars that generate sends over netcon AFTER the map has loaded (profile "dm"), see #73.
// SAFETY: HLAE and CS2 are only ever run offline with -insecure. Never join a VAC server with HLAE loaded.
// The gamemode cfg re-executes at map load and resets `mp_*` cvars and `bot_difficulty` (read back as 1 in #14), so they
// cannot be set from generate_dm.cfg. One command per line; generate joins them with ';' and splits at 400 characters,
// after `jointeam 1` and before `mp_restartgame 1`, then reads single-value cvars back and warns if one did not stick.

bot_difficulty 2
// A 10-minute round (the gamemode default) equals the chunk length; the match end changes level and ends the GOTV recording (#79)
mp_roundtime 60
